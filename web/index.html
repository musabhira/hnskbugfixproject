<!DOCTYPE html>
<html>

<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PoketMates">
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>PoketMates</title>
  <!-- Passkeys Web SDK required by Supabase / passkeys_web -->
  <script src="bundle.js"></script>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: #ffffff;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(250, 204, 21, 0.2);
      border-radius: 50%;
      border-top-color: #facc15;
      animation: spin 0.8s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="loading" class="loading-container">
    <div class="spinner"></div>
    <div style="font-size: 14px; color: #a1a1aa; font-weight: 500;">Loading PoketMates...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
