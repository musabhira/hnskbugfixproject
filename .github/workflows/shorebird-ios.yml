name: Shorebird iOS Release & TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (release or patch)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - patch
      release_version:
        description: 'Target release version (Only for patch, e.g. 1.0.149+324 or latest)'
        required: false
        default: 'latest'

concurrency:
  group: ios-shorebird-deployment
  cancel-in-progress: false

jobs:
  ios-shorebird:
    name: Shorebird iOS ${{ inputs.action || 'release' }}
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Newest Xcode
        run: |
          echo "Listing available Xcode versions:"
          ls -d /Applications/Xcode*
          NEWEST_XCODE=$(ls -d /Applications/Xcode* | tail -n 1)
          echo "Selecting newest Xcode: $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE"
          xcodebuild -version

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Determine Version and Build Number
        id: versioning
        run: |
          # 1. Parse marketing version from pubspec.yaml (e.g. 1.0.149)
          VERSION_NAME=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version: //' | sed 's/+.*//' | tr -d '\r\n ')

          # 2. Parse current base build number from pubspec.yaml (e.g. 324)
          PUBSPEC_BUILD_NUMBER=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/.*+//' | tr -d '\r\n ')

          # 3. Dynamic build number calculation to ensure strict monotonicity
          # If repository variable IOS_BUILD_NUMBER_BASE is set, add GITHUB_RUN_NUMBER to it.
          # Otherwise fallback to PUBSPEC_BUILD_NUMBER or pubspec + run_number offset.
          BASE_NUM="${{ vars.IOS_BUILD_NUMBER_BASE }}"
          if [ -n "$BASE_NUM" ] && [ "$BASE_NUM" -gt 0 ] 2>/dev/null; then
            CALCULATED_BUILD=$(( BASE_NUM + GITHUB_RUN_NUMBER ))
          else
            # Ensure at least PUBSPEC_BUILD_NUMBER (e.g. 324)
            CALCULATED_BUILD=$(( PUBSPEC_BUILD_NUMBER + GITHUB_RUN_NUMBER ))
          fi

          echo "Marketing Version (build-name): $VERSION_NAME"
          echo "Internal Build Number (build-number): $CALCULATED_BUILD"

          echo "build_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$CALCULATED_BUILD" >> $GITHUB_OUTPUT
          echo "full_version=$VERSION_NAME+$CALCULATED_BUILD" >> $GITHUB_OUTPUT

      - name: Install Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n ' | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Provisioning Profile
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n ' | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Run Shorebird Release or Patch
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          ACTION: ${{ inputs.action || 'release' }}
          BUILD_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
          PATCH_RELEASE_VERSION: ${{ inputs.release_version || 'latest' }}
        run: |
          # Re-unlock keychain and set default for building
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $RUNNER_TEMP/app-signing.keychain-db
          security default-keychain -s $RUNNER_TEMP/app-signing.keychain-db

          if [ "$ACTION" == "release" ]; then
            echo "🚀 Executing Shorebird iOS Release for $BUILD_NAME+$BUILD_NUMBER..."
            shorebird release ios \
              --export-options-plist=ios/ExportOptions.plist \
              --build-name="$BUILD_NAME" \
              --build-number="$BUILD_NUMBER"
          else
            echo "🩹 Executing Shorebird iOS Patch for release $PATCH_RELEASE_VERSION..."
            if [ -n "$PATCH_RELEASE_VERSION" ] && [ "$PATCH_RELEASE_VERSION" != "latest" ]; then
              shorebird patch ios \
                --export-options-plist=ios/ExportOptions.plist \
                --release-version="$PATCH_RELEASE_VERSION"
            else
              shorebird patch ios \
                --export-options-plist=ios/ExportOptions.plist \
                --release-version=latest
            fi
          fi

      - name: Verify and Standardize Shorebird IPA
        if: (inputs.action || 'release') == 'release'
        run: |
          mkdir -p build/ios/ipa
          if ! ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "❌ Error: Shorebird IPA file not found in build/ios/ipa/!"
            exit 1
          fi
          cd build/ios/ipa
          # Standardize filename for artifact and altool upload
          mv *.ipa pocket_mates_app.ipa || true
          echo "✅ Shorebird IPA verified at build/ios/ipa/pocket_mates_app.ipa"
          ls -lh pocket_mates_app.ipa

      - name: Upload IPA Artifact to GitHub
        if: (inputs.action || 'release') == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ios-shorebird-ipa-${{ steps.versioning.outputs.full_version }}
          path: build/ios/ipa/pocket_mates_app.ipa
          retention-days: 14

      - name: Upload Shorebird IPA to TestFlight
        if: (inputs.action || 'release') == 'release'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          IPA_PATH="build/ios/ipa/pocket_mates_app.ipa"
          echo "🚀 Uploading Shorebird-enabled IPA to TestFlight via App Store Connect altool..."
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "🎉 Successfully uploaded version ${{ steps.versioning.outputs.full_version }} to TestFlight!"

      - name: Deployment Summary Report
        if: always()
        run: |
          echo "### 🚀 POKET iOS Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Action**: ${{ inputs.action || 'release' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Version**: ${{ steps.versioning.outputs.full_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
