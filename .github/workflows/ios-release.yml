name: iOS Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing Version (e.g. 1.0.160, leave empty to read from pubspec.yaml)'
        required: false
        default: ''
      build_number:
        description: 'Build Number (e.g. 360, leave empty for automatic calculation)'
        required: false
        default: ''
      runner:
        description: 'macOS runner label (e.g. macos-15, macos-14, macos-latest)'
        required: false
        default: 'macos-15'

concurrency:
  group: ios-native-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and Release iOS
    runs-on: ${{ inputs.runner || 'macos-15' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List Available Xcodes (Debug)
        run: |
          echo "=== Available Xcode Applications ==="
          ls -la /Applications | grep -i Xcode || true
          xcode-select -p
          xcodebuild -version

      - name: Set up Xcode (Xcode 16+ with iOS 18 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.x'

      - name: Verify and Force Xcode 16+ Toolchain
        run: |
          XCODE_MAJOR=$(xcodebuild -version 2>/dev/null | head -n 1 | awk '{print $2}' | cut -d. -f1 || echo 0)
          echo "Active Xcode Major Version: $XCODE_MAJOR"
          if [ "$XCODE_MAJOR" -lt 16 ]; then
            echo "Searching for installed Xcode 16 in /Applications..."
            XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$XCODE_16" ] && [ -d "$XCODE_16" ]; then
              echo "Switching to $XCODE_16"
              sudo xcode-select -s "$XCODE_16/Contents/Developer"
            fi
          fi
          echo "=== Final Active Xcode Toolchain ==="
          xcodebuild -version
          xcode-select -p

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager (Use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Determine Version and Build Number
        id: versioning
        run: |
          # 1. Marketing Version (CFBundleShortVersionString)
          VERSION_NAME="${{ inputs.version_name }}"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version: //' | sed 's/+.*//' | tr -d '\r\n ')
          fi
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.160"
          fi

          # 2. Build Number (CFBundleVersion) - Monotonically increasing & retry-safe
          BASE_BUILD=361
          if [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            if [ -n "${{ vars.IOS_BUILD_NUMBER_BASE }}" ]; then
              BASE_BUILD="${{ vars.IOS_BUILD_NUMBER_BASE }}"
            fi
            # Count commits since anchor commit dce649e
            RAW_COMMIT_COUNT=$(git rev-list --count dce649e..HEAD 2>/dev/null || echo 1)
            COMMIT_OFFSET=$(( RAW_COMMIT_COUNT > 0 ? RAW_COMMIT_COUNT - 1 : 0 ))
            ATTEMPT_OFFSET=$(( GITHUB_RUN_ATTEMPT - 1 ))
            BUILD_NUMBER=$(( BASE_BUILD + COMMIT_OFFSET + ATTEMPT_OFFSET ))
          fi

          echo "Marketing Version (build-name): $VERSION_NAME"
          echo "Internal Build Number (build-number): $BUILD_NUMBER"
          echo "Full iOS Version: $VERSION_NAME+$BUILD_NUMBER"

          echo "build_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=$VERSION_NAME+$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 || secrets.BUILD_CERTIFICATE_BASE64 || secrets.CERTIFICATE_BASE64 || secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD || secrets.CERTIFICATE_PASSWORD || secrets.IOS_P12_PASSWORD || secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'app_signing_keychain_password_2026' }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "❌ Error: BUILD_CERTIFICATE_BASE64 / P12_BASE64 secret is not defined or empty!"
            exit 1
          fi

          echo "Base64 certificate string length: ${#BUILD_CERTIFICATE_BASE64}"
          echo "P12 password length: ${#P12_PASSWORD}"

          # Clean newlines and whitespace
          echo -n "$BUILD_CERTIFICATE_BASE64" | tr -d '\r\n ' > "$RUNNER_TEMP/cert.b64"

          # Decode certificate using robust multi-fallback
          if base64 -D -i "$RUNNER_TEMP/cert.b64" -o "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "✅ Decoded certificate with 'base64 -D'"
          elif base64 -d -i "$RUNNER_TEMP/cert.b64" -o "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "✅ Decoded certificate with 'base64 -d'"
          elif openssl base64 -d -in "$RUNNER_TEMP/cert.b64" -out "$CERTIFICATE_PATH" 2>/dev/null; then
            echo "✅ Decoded certificate with 'openssl base64 -d'"
          else
            echo "❌ Failed to decode certificate base64 data!"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/cert.b64"

          if [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "❌ Error: Decoded certificate file is empty or missing!"
            exit 1
          fi
          echo "Decoded certificate file size: $(wc -c < "$CERTIFICATE_PATH" | tr -d ' ') bytes"

          # Create keychain
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Certificate with fallback to legacy PKCS#12 conversion
          TRIMMED_P12_PASSWORD=$(echo -n "$P12_PASSWORD" | tr -d '\r\n')
          IMPORTED=0

          echo "Attempting standard security import..."
          if security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -k "$KEYCHAIN_PATH" 2>/dev/null; then
            echo "✅ Standard security import succeeded."
            IMPORTED=1
          elif [ -n "$TRIMMED_P12_PASSWORD" ] && security import "$CERTIFICATE_PATH" -P "$TRIMMED_P12_PASSWORD" -A -k "$KEYCHAIN_PATH" 2>/dev/null; then
            echo "✅ Security import succeeded with trimmed password."
            IMPORTED=1
          fi

          if [ $IMPORTED -eq 0 ]; then
            echo "⚠️ Standard security import failed. Checking if certificate requires legacy OpenSSL encryption format..."
            PEM_FILE="$RUNNER_TEMP/cert_and_key.pem"
            LEGACY_P12="$RUNNER_TEMP/legacy_cert.p12"
            ACTIVE_PASS=""

            if openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$P12_PASSWORD" -nokeys >/dev/null 2>&1; then
              ACTIVE_PASS="$P12_PASSWORD"
            elif [ -n "$TRIMMED_P12_PASSWORD" ] && openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$TRIMMED_P12_PASSWORD" -nokeys >/dev/null 2>&1; then
              ACTIVE_PASS="$TRIMMED_P12_PASSWORD"
            fi

            if [ -n "$ACTIVE_PASS" ]; then
              echo "🔑 OpenSSL verified certificate password! Converting to legacy PKCS#12 format for macOS Keychain compatibility..."

              # Detect if openssl supports -legacy (OpenSSL 3.x) or defaults to legacy (LibreSSL)
              LEGACY_FLAG=""
              if openssl pkcs12 -help 2>&1 | grep -q -- "-legacy"; then
                LEGACY_FLAG="-legacy"
                echo "Using OpenSSL with -legacy flag"
              else
                echo "Using standard/LibreSSL legacy export (without -legacy flag)"
              fi

              # Step 1: Export decrypted key and certs to PEM
              openssl pkcs12 -in "$CERTIFICATE_PATH" -nodes -passin pass:"$ACTIVE_PASS" -out "$PEM_FILE"

              # Step 2: Export from PEM to legacy PKCS#12
              openssl pkcs12 -export -in "$PEM_FILE" -out "$LEGACY_P12" -passout pass:"$ACTIVE_PASS" $LEGACY_FLAG

              echo "Importing re-packaged legacy certificate into keychain..."
              if security import "$LEGACY_P12" -P "$ACTIVE_PASS" -A -k "$KEYCHAIN_PATH"; then
                echo "✅ Legacy-formatted certificate imported successfully."
                IMPORTED=1
              else
                echo "❌ security import failed on legacy-formatted certificate. Diagnostic output:"
                security import "$LEGACY_P12" -P "$ACTIVE_PASS" -A -k "$KEYCHAIN_PATH" || true
              fi
              rm -f "$PEM_FILE" "$LEGACY_P12"
            else
              echo "❌ ERROR: Could not verify certificate password with OpenSSL or Keychain."
              echo "Direct security import error output:"
              security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -k "$KEYCHAIN_PATH" || true
              exit 1
            fi
          fi

          if [ $IMPORTED -ne 1 ]; then
            echo "❌ ERROR: Failed to import certificate into keychain."
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "=== Installed Signing Identities ==="
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 || secrets.PROVISIONING_PROFILE_BASE64 || secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          if [ -z "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "❌ Error: BUILD_PROVISION_PROFILE_BASE64 / MOBILEPROVISION_BASE64 secret is not defined or empty!"
            exit 1
          fi

          echo "Base64 provisioning profile length: ${#BUILD_PROVISION_PROFILE_BASE64}"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\r\n ' > "$RUNNER_TEMP/profile.b64"

          if base64 -D -i "$RUNNER_TEMP/profile.b64" -o "$PP_PATH" 2>/dev/null; then
            echo "✅ Decoded provisioning profile with 'base64 -D'"
          elif base64 -d -i "$RUNNER_TEMP/profile.b64" -o "$PP_PATH" 2>/dev/null; then
            echo "✅ Decoded provisioning profile with 'base64 -d'"
          elif openssl base64 -d -in "$RUNNER_TEMP/profile.b64" -out "$PP_PATH" 2>/dev/null; then
            echo "✅ Decoded provisioning profile with 'openssl base64 -d'"
          else
            echo "❌ Failed to decode provisioning profile base64 data!"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/profile.b64"

          if [ ! -s "$PP_PATH" ]; then
            echo "❌ Error: Decoded provisioning profile file is empty or missing!"
            exit 1
          fi
          echo "Decoded provisioning profile size: $(wc -c < "$PP_PATH" | tr -d ' ') bytes"

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/
          echo "✅ Provisioning profile installed."

      - name: Clean Build Environment
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Download iOS Platform
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS || true

      - name: Build and Sign IPA
        env:
          VERSION_NAME: ${{ steps.versioning.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.versioning.outputs.build_number }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'app_signing_keychain_password_2026' }}
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts NO

          echo "🚀 Building Native Flutter iOS: version $VERSION_NAME+$BUILD_NUMBER"

          flutter build ios --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --no-codesign

          # Re-unlock keychain and set as default for the archive phase
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $RUNNER_TEMP/app-signing.keychain-db
          security default-keychain -s $RUNNER_TEMP/app-signing.keychain-db

          # Archive directly with xcodebuild
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/Runner.xcarchive -sdk iphoneos -destination 'generic/platform=iOS' SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO archive

          # Export the archive
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist

      - name: Check and Standardize IPA Filename
        run: |
          mkdir -p build/ios/ipa
          if ! ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "❌ Error: IPA file not found in build/ios/ipa/!"
            exit 1
          fi
          # Rename any IPA containing colons (e.g. 'Handskill : PocketMates.ipa') to clean filename for actions/upload-artifact
          ORIGINAL_IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "Found original IPA: $ORIGINAL_IPA"
          mv "$ORIGINAL_IPA" build/ios/ipa/pocket_mates_app.ipa
          echo "✅ Standardized IPA path: build/ios/ipa/pocket_mates_app.ipa"

      - name: Verify IPA Metadata
        env:
          EXPECTED_VERSION: ${{ steps.versioning.outputs.build_name }}
          EXPECTED_BUILD: ${{ steps.versioning.outputs.build_number }}
        run: |
          IPA_PATH="build/ios/ipa/pocket_mates_app.ipa"
          echo "🔍 Inspecting IPA metadata: $IPA_PATH"

          TEMP_DIR=$(mktemp -d)
          unzip -q -j "$IPA_PATH" "Payload/*.app/Info.plist" -d "$TEMP_DIR"
          PLIST="$TEMP_DIR/Info.plist"

          ACTUAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST" 2>/dev/null || echo "")
          ACTUAL_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST" 2>/dev/null || echo "")
          ACTUAL_BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST" 2>/dev/null || echo "")

          echo "=== IPA Verification Results ==="
          echo "CFBundleIdentifier:         $ACTUAL_BUNDLE_ID (Expected: com.handskill.friends)"
          echo "CFBundleShortVersionString: $ACTUAL_VERSION (Expected: $EXPECTED_VERSION)"
          echo "CFBundleVersion:            $ACTUAL_BUILD (Expected: $EXPECTED_BUILD)"

          if [ "$ACTUAL_BUNDLE_ID" != "com.handskill.friends" ]; then
            echo "❌ Error: Bundle ID mismatch! Expected 'com.handskill.friends', found '$ACTUAL_BUNDLE_ID'"
            exit 1
          fi

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "❌ Error: Marketing version mismatch! Expected '$EXPECTED_VERSION', found '$ACTUAL_VERSION'"
            exit 1
          fi

          if [ "$ACTUAL_BUILD" != "$EXPECTED_BUILD" ]; then
            echo "❌ Error: Build number mismatch! Expected '$EXPECTED_BUILD', found '$ACTUAL_BUILD'"
            exit 1
          fi

          echo "✅ IPA metadata successfully verified against expected release values."
          rm -rf "$TEMP_DIR"

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ios-native-ipa-${{ steps.versioning.outputs.full_version }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          TARGET_VERSION: ${{ steps.versioning.outputs.full_version }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          IPA_PATH="build/ios/ipa/pocket_mates_app.ipa"

          echo "🚀 Uploading Native IPA to App Store Connect via xcrun altool..."
          echo "Target Binary: $IPA_PATH"
          echo "Target Version: $TARGET_VERSION"

          set +e
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose
          UPLOAD_EXIT_CODE=$?
          set -e

          if [ $UPLOAD_EXIT_CODE -eq 0 ]; then
            echo "🎉 Upload command succeeded!"
            echo "✅ Binary received by Apple App Store Connect."
            echo "ℹ️ Note: TestFlight processing typically takes 5–15 minutes before appearing in App Store Connect."
          else
            echo "❌ ERROR: xcrun altool upload failed with exit code $UPLOAD_EXIT_CODE."
            exit $UPLOAD_EXIT_CODE
          fi

      - name: Release Summary Report
        if: always()
        run: |
          echo "### 🍏 Native iOS Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Pipeline**: Native Flutter / Xcode (No Shorebird)" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Version**: ${{ steps.versioning.outputs.full_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
