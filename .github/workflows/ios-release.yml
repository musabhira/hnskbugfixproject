name: 🚀 iOS TestFlight Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── 2. Xcode ───────────────────────────────────────────────────────────
      - name: Set up Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Show Xcode version
        run: xcodebuild -version

      # ── 3. Flutter ─────────────────────────────────────────────────────────
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager (use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      # ── 4. Dart / Pub cache ────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      # ── 5. CocoaPods cache ─────────────────────────────────────────────────
      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      # ── 6. Code Signing ────────────────────────────────────────────────────
      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate — macOS BSD base64 uses -D not --decode
          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n ' | base64 -D -o "$CERTIFICATE_PATH"

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "✅ Certificate installed:"
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n ' | base64 -D -o "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$PP_PATH" ~/Library/MobileDevice/"Provisioning Profiles"/
          echo "✅ Provisioning profile installed."

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/version: //' | sed 's/+.*//' | tr -d '\r\n ')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | head -n1 | sed 's/.*+//' | tr -d '\r\n ')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📦 Building v$VERSION_NAME+$BUILD_NUMBER"

      - name: Flutter build iOS (no codesign)
        run: |
          flutter build ios --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.number }}" \
            --no-codesign

      - name: Re-unlock keychain before archive
        run: |
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$RUNNER_TEMP/app-signing.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/app-signing.keychain-db"

      - name: Archive with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            CLANG_ENABLE_EXPLICIT_MODULES=NO \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      # ── 8. Verify & save IPA ───────────────────────────────────────────────
      - name: Verify IPA was created
        run: |
          IPA=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n1)
          if [ -z "$IPA" ]; then
            echo "❌ IPA not found!"
            exit 1
          fi
          echo "✅ IPA ready: $IPA ($(du -sh "$IPA" | cut -f1))"

      - name: Save IPA as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketMates-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.number }}
          path: build/ios/ipa/*.ipa
          retention-days: 14

      # ── 9. Upload to TestFlight ────────────────────────────────────────────
      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          IPA_PATH=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "📤 Uploading $IPA_PATH to TestFlight..."

          xcrun altool \
            --upload-app \
            --type ios \
            -f "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --verbose

          echo "🎉 Done! Check TestFlight in App Store Connect."


on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Release iOS
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: List Available Xcodes (Debug)
        run: |
          ls /Applications | grep Xcode
          xcode-select -p
          xcodebuild -version

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Disable Swift Package Manager (Use CocoaPods)
        run: flutter config --no-enable-swift-package-manager

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "$BUILD_CERTIFICATE_BASE64" | tr -d '\n ' | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | xargs)
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "Listing identities in keychain:"
          security find-identity -v -p codesigning

      - name: Install Provisioning Profile
        env:
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '\n ' | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp $PP_PATH ~/Library/MobileDevice/"Provisioning Profiles"/

      - name: Clean Build Environment
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Download iOS Platform
        run: |
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS

      - name: Build and Sign IPA
        run: |
          defaults write com.apple.dt.Xcode IDEPackageEnablePrebuilts NO

          # Extract version and build number cleanly without CRLF or whitespace
          VERSION_NAME=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/version: //' | sed 's/+.*//' | tr -d '\r\n ')
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | head -n 1 | sed 's/.*+//' | tr -d '\r\n ')

          echo "Building version $VERSION_NAME+$BUILD_NUMBER"

          flutter build ios --release --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" --no-codesign

          # Re-unlock keychain and set as default for the archive phase
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" $RUNNER_TEMP/app-signing.keychain-db
          security default-keychain -s $RUNNER_TEMP/app-signing.keychain-db

          # Archive directly with xcodebuild
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/ios/Runner.xcarchive -sdk iphoneos -destination 'generic/platform=iOS' SWIFT_ENABLE_EXPLICIT_MODULES=NO CLANG_ENABLE_EXPLICIT_MODULES=NO archive

          # Export the archive
          xcodebuild -exportArchive -archivePath build/ios/Runner.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist

      - name: Check for IPA
        run: |
          if ! ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "IPA file not found!"
            exit 1
          fi

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_KEY_CONTENT" > ~/.private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          IPA_PATH=$(ls build/ios/ipa/*.ipa)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
